[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "harnessweaver-pydantic-ai"
version = "0.1.2"
description = "HarnessWeaver plugin: Pydantic AI."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Muthu Kumaran R", email = "rsmk7new@gmail.com" }]
requires-python = ">=3.12"
keywords = ["ai", "llm", "harness", "guardrails", "agents", "governance", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "harnessweaver>=0.1.0",
    "pydantic-ai-slim>=2.57,<3",
]

[project.entry-points."harnessweaver.plugins"]
pydantic_ai = "harnessweaver_pydantic_ai:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/harnessweaver_pydantic_ai"]
