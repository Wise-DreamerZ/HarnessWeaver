[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "harnessweaver-openai"
version = "0.2.0"
description = "HarnessWeaver plugin: OpenAI-compatible models."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Muthu Kumaran R", email = "rsmk7new@gmail.com" }]
requires-python = ">=3.12"
keywords = ["ai", "llm", "harness", "guardrails", "agents", "governance", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "harnessweaver>=0.18.0",
    "openai>=3.26",
]

[project.entry-points."harnessweaver.plugins"]
openai = "harnessweaver_openai:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/harnessweaver_openai"]
