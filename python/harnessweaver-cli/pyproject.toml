[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "harnessweaver-cli"
version = "0.7.2"
description = "Developer tooling for HarnessWeaver: the harnessweaver command."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Muthu Kumaran R", email = "rsmk7new@gmail.com" }]
requires-python = ">=3.12"
keywords = ["ai", "llm", "harness", "guardrails", "agents", "governance", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "harnessweaver>=0.1.0",
    "typer>=0.27",
    "rich>=15",
    "ruamel-yaml>=0.18",
]

[project.scripts]
harnessweaver = "harnessweaver_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/harnessweaver_cli"]
