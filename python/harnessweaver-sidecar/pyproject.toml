[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "harnessweaver-sidecar"
version = "0.2.1"
description = "harnessd: serves the HarnessWeaver core to every other language over HTTP."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Muthu Kumaran R", email = "rsmk7new@gmail.com" }]
requires-python = ">=3.12"
keywords = ["ai", "llm", "harness", "guardrails", "agents", "governance", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "harnessweaver>=0.1.0",
    "fastapi>=0.143",
    "uvicorn>=0.54",
]

[project.scripts]
harnessd = "harnessweaver_sidecar.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harnessweaver_sidecar"]
