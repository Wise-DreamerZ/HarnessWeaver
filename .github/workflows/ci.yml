name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned by commit SHA (RULES S5).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --locked
      - name: Lint, format, types, tests
        run: make check

  # The README's coverage badge reads coverage.json from the `badges` branch. Only a push to
  # main writes it, once the Python jobs pass, so pull requests never get a write token.
  coverage:
    name: Coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: python
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --locked
      - name: Measure coverage
        run: make cov
      # A shields.io endpoint file, colored by the RULES T7 floors. The branch holds one
      # commit that each run replaces, so it never grows.
      - name: Publish the coverage badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pct=$(uv run coverage report --format=total)
          if [ "$pct" -ge 90 ]; then color=brightgreen; elif [ "$pct" -ge 80 ]; then color=yellow; else color=red; fi
          mkdir "$RUNNER_TEMP/badges" && cd "$RUNNER_TEMP/badges"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > coverage.json
          git init -q -b badges
          git add coverage.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore: coverage ${pct}%"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      # Example 04's tests start harnessd, so the Python workspace is installed too.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install the Python workspace
        working-directory: .
        run: uv sync --all-packages --locked
      # The tests read the shared fixtures in contracts/ and the examples (R11, T4).
      - name: Types, tests, build
        run: pnpm typecheck && pnpm test && pnpm build
      # The docs' spec generator writes app specs for TypeScript too: load them with the core
      # just built, which make check doesn't have, so there these tests are skipped.
      - name: Spec generator, in TypeScript
        working-directory: .
        env:
          REQUIRE_TS_CORE: "1"
        run: uv run --locked pytest docs_src/tests/test_spec_generator.py -q -k typescript_core

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      # Strict: a broken link or anchor, or a page missing from the navigation, fails (ADR-0041).
      - name: Build the docs site
        run: make docs
